[package]
name = "_accel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_accel"
crate-type = ["cdylib"]

[dependencies]
# crate-type 是 cdylib：产物由宿主解释器在 import 时解析 Python 符号，不该链接
# libpython（abi3 下也没有能匹配的那份库）。`extension-module` 就是表达这件事的
# 唯一**显式**开关——`pyo3_build_config::is_extension_module()` 认两种输入：
# cargo feature `CARGO_FEATURE_EXTENSION_MODULE`，或环境变量
# `PYO3_BUILD_EXTENSION_MODULE`（impl_.rs:1579-1581）。早先这里用后者，藏在
# build_accel.py 的环境 dict 里，既看不见也不好验证，统一改成 feature。
#
# 但它只解决「别链接 libpython」这一半。符号不链接之后仍需要「留到运行期解析」，
# 即 macOS 的 `-undefined dynamic_lookup` —— pyo3 0.29.3 的 build script **不会**
# 自己 emit（`pyo3-0.29.3/build.rs` 的 configure_pyo3 只转发 build_config、
# `pyo3-ffi-0.29.3/build.rs` 只在需要链接 libpython 时 emit_link_config）；
# `pyo3_build_config::add_extension_module_link_args()` 只提供函数，由项目自己的
# build script 调用。缺了它 macOS arm64 报：
#   ld: symbol(s) not found for architecture arm64
#   "_Py_IncRef", referenced from: ... in _accel...rcgu.o
# Linux 的共享对象允许未定义符号拖到运行期、Windows 的 is_linking_libpython_for_target
# 对 Windows 恒为真（走 raw-dylib/import library），所以三平台里只有 macOS 当场失败。
pyo3 = { version = "=0.29.3", features = ["abi3-py38", "extension-module"] }

[build-dependencies]
# build.rs 用它来补 macOS 的 `-undefined dynamic_lookup`（其它平台是空操作）。
pyo3-build-config = "=0.29.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1