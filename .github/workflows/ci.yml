name: ci

# 多版本矩阵：3.8（部署底线）到 3.15
# （当前最新稳定版；3.13 是本机实测版本）。
# 为什么 fail-fast: false —— 一个版本红不能遮住其他版本的结果，
# 否则"哪个版本坏了"会被第一个失败吞掉。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        # 只影响 join-bench：true 时把右表加到 1e6。
        # 本机（16 核 / Python 3.13）实测 `--ci` 11.5 s、`--ci --full` 31.5 s；
        # runner 上按 2–4 倍估，仍在 10 分钟预算内。
        # 其余 job 不读这个输入，行为与之前完全一致。
        description: "join-bench 跑 1e6 右表档"
        type: boolean
        default: false
      bench_full:
        # 只影响 accel-bench：true 时跑全量规模（本机 6–8 分钟），false 跑 `--ci`
        # 档（2000 行 / 3 次采样）。
        # 为什么不与上面的 `full` 合并：join-bench 的 1e6 档与 accel-bench 的全量档
        # 是两个独立的耗时旋钮，绑在一起会让「只想重跑其中一个」也必须连带跑另一个；
        # 且两者预算不同（join 31.5 s vs accel 6–8 min），合并后手动触发的默认值
        # 一定会有一个是错的。
        description: "accel-bench 跑全量规模（默认只跑 --ci 档）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------- 本地拉回
#
# 为什么要把 CI 的产物拉回本地：发版机器上没有 macOS，**也没有和 runner 同款的
# 编译环境**。`dcg/_accel/` 里入库的 4 个二进制必须与「CI 亲手构建、亲手在
# Python 3.8 与 3.15 上加载过」的那一个文件是同一份字节，否则 wheel 里躺的就是
# 一份没人验证过的产物。
#
# 前置：`gh auth login`（或 `GH_TOKEN`），以及 `gh` 2.x。
#
#   1) 找到最近一次跑成功（或要取产物）的 run id：
#        gh run list --workflow=ci.yml --limit 5
#
#   2) 只列出这次 run 产出了哪些 artifact（名字应为
#      `accel-linux-x64` / `accel-windows-x64` / `accel-macos-x64` /
#      `accel-macos-arm64`，外加 `join-bench`、`accel-bench`）：
#        gh run view <run-id> --json jobs --jq '.jobs[].name'
#        gh api repos/{owner}/{repo}/actions/runs/<run-id>/artifacts \
#          --jq '.artifacts[].name'
#
#   3) 全部拉回到 `_tmp/ci-artifacts/`（该目录已被 .gitignore 忽略）：
#        gh run download <run-id> -D _tmp/ci-artifacts
#      只拉某一个平台：
#        gh run download <run-id> -n accel-macos-arm64 -D _tmp/ci-artifacts
#
#   4) 覆盖入库的二进制前先看清 diff（**第 3 步不会自动替换仓库里的文件**，
#      `-D` 只是解压到指定目录，替换必须手动作，这是一道有意的闸）：
#        git status dcg/_accel
#        for f in _tmp/ci-artifacts/*/dcg/_accel/*; do
#          echo "$(basename "$f")  $(sha256sum "$f" | cut -d' ' -f1)  \
#        $(sha256sum "dcg/_accel/$(basename "$f")" 2>/dev/null | cut -d' ' -f1)"
#        done
#      注意 macOS 的两个产物名带架构后缀（`_accel-macos-arm64.abi3.so` /
#      `_accel-macos-x64.abi3.so`），Linux/Windows 的是 `_accel.abi3.so` /
#      `_accel.pyd` —— 与 `build_accel.artifact_name()` 完全一致，照名字对齐即可。
#
#   5) 覆盖后**必须重跑**这两组，确认改动没有破坏加载与漂移检测：
#        python -X utf8 -m pytest tests/test_accel_gate.py tests/test_packaging.py -q
#        python -X utf8 -m pytest tests/test_sync_contract.py -q
#      （`test_accel_gate.py` 里有一组断言校验入库二进制的 Mach-O/ELF/PE magic
#      与架构，覆盖错了会当场红。）
#
# 基准 json 同样这样取：`_tmp/ci-artifacts/accel-bench/_tmp/accel-bench.json`
# （artifact 内部保留了 `_tmp/` 这段相对路径），把它与本机跑的结果对比时**只比
# 比值（ratio），不比绝对耗时** —— 跨机器的毫秒数没有可比性。

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: false

      # pytest 8+ 不支持 3.8，pytest 9.x 需要 3.9+。
      # 这里显式钉住，而不是让 pip 自己解析 —— 解析失败时报错信息非常难读。
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.8" ]; then
            python -m pip install "pytest>=7,<8"
          elif [ "${{ matrix.python-version }}" = "3.9" ]; then
            python -m pip install "pytest>=7,<9"
          else
            python -m pip install "pytest>=7"
          fi
          python -m pip install -e .

      # 语法底线：用 3.8 的语法规则解析全部源码。
      # 这一步比 pytest 更早失败，且给出精确的文件:行号，
      # 防止有人无意引入 3.9+ 的语法（如 dict|dict、match、removeprefix）。
      - name: syntax floor (3.8 grammar)
        run: python -X utf8 evidence/ci_syntax_floor.py

      # --tb=short 让失败栈直接出现在日志里；输出同时重定向到文件，
      # 再用 ::error:: 转成 annotation —— runner 日志端点要认证（403），
      # 而 annotation 走公开 API 就能读到，这是唯一能远程拿到失败文本的通道。
      # 同一个 run 在八个版本上同时失败时，只有 annotation 能区分「哪个版本哪里坏」。
      - name: pytest
        run: |
          set +e
          python -X utf8 -m pytest -q --tb=short > pytest.log 2>&1
          rc=$?
          grep -E '^(FAILED|ERROR|E   )' pytest.log | head -n 20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          head -n 3 pytest.log | while IFS= read -r line; do
            echo "::error::HEAD $line"
          done
          tail -n 15 pytest.log | while IFS= read -r line; do
            echo "::error::TAIL $line"
          done
          echo "----- pytest.log -----"
          cat pytest.log
          exit $rc

      - name: pytest diagnostics
        if: always()
        run: |
          python -VV
          python -m pytest --version
          python -c "import platform,sys;print(platform.platform());print(sys.getfilesystemencoding())"

      # accept.py 只用标准库，不依赖 pytest，任何版本都能跑。
      # 退出码 0 = 全部门禁 PASS（SKIP 只允许白名单内的那一条）。
      - name: acceptance gates
        run: |
          set +e
          python -X utf8 evidence/accept.py > accept.log 2>&1
          rc=$?
          grep -E '^\[(FAIL|SKIP)\]' accept.log | head -n 20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 25 accept.log | while IFS= read -r line; do
            echo "::error::TAIL $line"
          done
          cat accept.log
          exit $rc

      # 入库二进制的**导出集合**校验（硬门禁）。
      #
      # 为什么必须有这一步：`dcg/_accel/` 里的 4 个产物是**历史构建**的产物，Rust
      # 源码新增导出后如果忘了重建、忘了提交，测试跑的还是旧二进制，而 `accel`
      # job 里那步只验「本平台刚构建出来的那个文件能导入、导出集合对」——旧产物
      # 那句断言根本管不到。破缺形态是：`dcg/runtime.py` 已无条件调 `_ACC.<新名>`
      # （前置守卫只判 `_ACC is not None`），于是**拿到旧产物的平台直接
      # `AttributeError` 崩溃**，不是「退回纯 Python」。本机验不出这种破缺（只有
      # 自己那份 pyd），只有对着**四个入库文件**逐个查才看得见。
      #
      # 为什么不用 sha256 判：跨平台重建不可能字节相同，同一台机器重跑也会因 PE 头
      # 时间戳 / PDB GUID / dist-info `date_time` 而不同（R4 实测「内容可复现、
      # 字节不可复现」）。所以下面 `accel` job 里的 sha256 漂移检测只能当 warning
      # ——它的判定力只有「内容看起来变了没」。而「这个二进制里到底有没有这个导出
      # 名」是**与时间戳无关的确定性质**，可以当 error。两段并存，别互相替代：
      # sha256 → 提示「仓库二进制与源码构建结果不一致」；导出集合 → 拦住崩溃。
      #
      # 探测原理：`PyMethodDef.ml_name` 是 NUL 结尾的 C 字符串，编译进只读数据段
      # 后的字节形态就是 `\x00<名字>\x00`。因此不需要执行它、也不需要匹配的解释器
      # 或架构，在 ubuntu runner 上就能验全部四个平台的文件。
      - name: shipped binaries carry every expected export
        run: |
          python - <<'PY'
          import ast
          import io
          import os
          import sys

          # 符号列表的唯一来源：`accel` job 的断言也读同一个常量，避免第三份副本。
          SRC = "evidence/accel_matrix.py"
          # 4 个平台的入库产物：Windows / Linux / macOS x64 / macOS arm64。
          FILES = [
              "dcg/_accel/_accel.pyd",
              "dcg/_accel/_accel.abi3.so",
              "dcg/_accel/_accel-macos-x64.abi3.so",
              "dcg/_accel/_accel-macos-arm64.abi3.so",
          ]

          want = None
          for node in ast.parse(io.open(SRC, encoding="utf-8").read()).body:
              if (isinstance(node, ast.Assign)
                      and getattr(node.targets[0], "id", "") == "EXPECTED_EXPORTS"):
                  want = sorted(ast.literal_eval(node.value))
                  break
          if not want:
              sys.exit("%s 里没有可解析的 EXPECTED_EXPORTS 字面量" % SRC)

          bad = 0
          for rel in FILES:
              if not os.path.isfile(rel):
                  print("::error title=accel binary missing::%s 不在仓库里 —— "
                        "4 个平台的产物都必须入库，否则该平台没有可加载的扩展" % rel)
                  bad += 1
                  continue
              blob = io.open(rel, "rb").read()
              got = [n for n in want if (b"\x00" + n.encode() + b"\x00") in blob]
              if len(got) != len(want):
                  missing = [n for n in want if n not in got]
                  print("::error title=accel exports missing::%s 缺少导出 %r"
                        "（期望 %d 个，实际 %d 个）—— 该平台拿到这个二进制会在"
                        " `_ACC.<新名>` 处 AttributeError，请重建并提交产物"
                        % (rel, missing, len(want), len(got)))
                  bad += 1
              else:
                  print("%s ok: %d/%d exports" % (rel, len(got), len(want)))
          print("expected exports (%d): %s" % (len(want), want))
          sys.exit(1 if bad else 0)
          PY

  # 可选 Rust 加速后端（`dcg/_accel`）的三平台构建 + abi3 覆盖断言。
  #
  # 为什么单独一个 job：上面那个 `test` job 从不安装 Rust，所以 `dcg/_accel`
  # 在 CI 上永远不存在，双活会静默退化成单活 —— 门控的 Rust 分支一行都没被跑过，
  # 测试仍然全绿。这个 job 的唯一职责就是让「有扩展」的那条路在 CI 上真实发生。
  #
  # 为什么不并入 `test` 矩阵：八个 Python 版本 × 四个平台全编译 Rust 是 32 次
  # cargo 构建，而 abi3 的意义正是「一个二进制覆盖 3.8–3.15」，编译一遍就够了。
  #
  # 为什么 macOS 有两个平台：`abi3` 覆盖断言必须在**真的有 Python 3.8** 的机器上做，
  # 而 `actions/python-versions` 的 3.8 预编译产物只到 x64（3.8.18 只有
  # `darwin/x64`、`linux/*`、`win32/*`；`darwin/arm64` 只到 3.8.10 就停了）。所以：
  #   * `macos-15-intel`（x64）—— 硬断言，跑不通过就是红；
  #   * `macos-latest`（arm64）—— 只验证「arm64 也能构建 + 3.13 能加载」，
  #     3.8 加载降级为 warning（没有 3.8 可装，不是我们的问题）。
  # 这样既不放弃 arm64 的构建验证，也不拿「装不上 3.8」冒充 abi3 结论。
  #
  # `macos-15-intel` 是 GitHub Actions 目前在售的唯一 x86_64 标准标签
  # （可用至 2027-08）。已退役的 macOS 标签不会报错，只会让 job 永远 `queued`
  # ——没有 runner 能匹配 `runs-on`，既不跑也不红，整条平台等于没验过。
  accel:
    name: accel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台红不能遮住另外两个平台的结果：失败信息里平台名是关键定位信息。
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            strict_38: true
          - os: windows-latest
            strict_38: true
          - os: macos-15-intel
            strict_38: true
          - os: macos-latest
            strict_38: false

    steps:
      - uses: actions/checkout@v4

      # 只用 3.13 构建：`abi3-py38` 的产物与构建用的解释器版本无关，
      # 换版本构建不会得到不同的覆盖范围，只会浪费一次编译。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: false

      # 装 Rust 工具链。选 `dtolnay/rust-toolchain@stable` 而不是 rustup 官方
      # 安装脚本：官方脚本是 `curl ... | sh` 形态，在 windows-latest 的默认
      # shell（pwsh）里没有等价写法，三平台就得写三套；这个 action 只是对
      # `rustup` 的一层薄封装（作者是 Rust 官方团队成员），不额外执行任何脚本。
      # 仓库其余地方只用官方 actions，这里是唯一的第三方 action，理由即上述
      # 「跨平台安装 rustup 没有官方 action」。
      - uses: dtolnay/rust-toolchain@stable

      # 直接跑仓库自己的构建脚本，不复制它的逻辑：产物名、CARGO_TARGET_DIR、
      # PYO3_PYTHON 都由脚本决定，CI 与本地必须是同一条命令才谈得上等价。
      # 不传 `--proxy`：那是本机 schannel 不可用时的回环代理绕过，runner 上
      # 没有这个问题，带上反而多一个失败点。
      - name: build accel
        run: python build_accel.py

      # 断言产物真的存在、且真的能被导入。
      # 显式 `shell: bash`：GitHub Actions 的默认 shell 在 ubuntu/macos 是 bash、
      # 在 windows 是 pwsh，同一段脚本在两种 shell 里语法不通用；windows-latest
      # 自带 git-bash，统一到 bash 才能让三个平台共用下面这一行。
      # 断言「导出集合恰好等于期望集合」而不是「至少包含」：多出来的名字说明
      # `src/lib.rs` / `src/newfn.rs` 与 Python 侧的预期已经漂移。
      #
      # 期望集合**不在这里写第二份**：唯一来源是 `evidence/accel_matrix.py` 的
      # `EXPECTED_EXPORTS`（那份列表本来就负责「本机多解释器 × 导入冒烟」，
      # 是导出面的事实标准）。早先 ci.yml 里也硬编码了一份同样的 13 个名字，
      # 于是 Rust 侧新增一个导出就要改两处，漏一处就是「CI 绿但集合已漂移」——
      # 正是这条断言想防的事，却由断言自己引入。
      # 用 `ast.literal_eval` 只解析字面量、**不 import**：`accel_matrix.py` 被
      # import 时会做路径探测与参数解析，CI 这里只需要那一个常量。
      - name: assert artifact and exports
        shell: bash
        run: |
          ls -l dcg/_accel
          # 产物名不再在这里写死：由 build_accel.artifact_name() 决定（macOS 带架构
          # 后缀），加载器按同一张表选文件。写死 `_accel.abi3.so` 的旧写法在 macOS
          # 上永远匹配不到真正的产物 —— 而 `test -f A || test -f B` 又会被**上一次**
          # 构建残留的文件蒙混过关，于是 CI 验新的、运行期加载旧的。
          python -c "import sys, os, build_accel; n = build_accel.artifact_name(); p = os.path.join('dcg', '_accel', n); print('expected artifact:', p); sys.exit(0 if os.path.isfile(p) else '缺产物：' + p)"
          python - <<'PY'
          import ast
          import io
          import sys

          SRC = "evidence/accel_matrix.py"
          try:
              tree = ast.parse(io.open(SRC, encoding="utf-8").read())
          except (OSError, SyntaxError) as exc:
              sys.exit("读不到导出面唯一来源 %s：%s" % (SRC, exc))
          want = None
          for node in tree.body:
              if not isinstance(node, ast.Assign):
                  continue
              for target in node.targets:
                  if getattr(target, "id", None) == "EXPECTED_EXPORTS":
                      want = sorted(ast.literal_eval(node.value))
          # 找不到常量要**报错退出**，不能退化成「跳过断言」：那样这条 step
          # 会在无人察觉的情况下永远绿。
          if not want:
              sys.exit("%s 里没有可解析的 EXPECTED_EXPORTS 字面量" % SRC)

          import dcg._accel._accel as m
          got = sorted(n for n in dir(m) if not n.startswith("_"))
          print("expected(%s): %s" % (SRC, want))
          print("got: %s" % got)
          if got != want:
              missing = [n for n in want if n not in got]
              extra = [n for n in got if n not in want]
              sys.exit(
                  "导出集合漂移：缺 %r，多 %r。"
                  "若这是有意的 Rust 侧变更，把 %s 的 EXPECTED_EXPORTS 与 "
                  "dcg/runtime.py 的接线点一起改掉；"
                  "若无意，说明 %s 与 Rust 源码已经不同步"
                  % (missing, extra, SRC, SRC))
          PY

      # 二进制漂移检测（只警告、不失败）。
      #
      # 4 个产物已经入库，但 CI 重建后从不与入库版本比对：Rust 源码改了、产物忘了
      # 提交，测试跑的还是旧二进制，而上面那步只验「能导入、导出集合等于
      # `accel_matrix.EXPECTED_EXPORTS`」——旧产物同样满足。跨平台重建不可能字节
      # 相同（编译器/链接器版本不同），所以这里比的是**本平台同名产物**与
      # `git show HEAD:` 的 sha256，不一致只发 warning annotation 提示
      # 「若确为源码变更请提交新产物」。
      - name: warn when the shipped binary drifts from a fresh build
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys

          sys.path.insert(0, ".")
          import build_accel

          name = build_accel.artifact_name()
          rel = "dcg/_accel/" + name
          if not os.path.isfile(rel):
              print("::warning title=accel artifact missing::%s 构建后不存在" % rel)
              sys.exit(0)
          fresh = hashlib.sha256(open(rel, "rb").read()).hexdigest()
          try:
              old = subprocess.run(["git", "show", "HEAD:" + rel],
                                   capture_output=True, check=True).stdout
          except subprocess.CalledProcessError:
              print("::warning title=accel artifact untracked::%s 尚未入库" % rel)
              sys.exit(0)
          shipped = hashlib.sha256(old).hexdigest()
          print("%s fresh=%s shipped=%s" % (name, fresh[:16], shipped[:16]))
          if fresh != shipped:
              print("::warning title=accel binary drift::%s 与入库版本字节不同；"
                    "若本次改动涉及 dcg/_accel/src/*.rs，请重新构建并提交产物" % rel)
          PY

      # 四个平台都上传本平台产物（早先只传 macOS）。
      #
      # 为什么现在连 Linux/Windows 也传：发版机器上没有 macOS，但**同样没有干净的
      # 交叉编译环境**，而且「本地能构建」不等于「本地构建出来的那个字节就是 CI
      # 验过 abi3 的那个字节」——只有把 CI 亲手构建、亲手在 3.8 与 3.15 上加载过的
      # 那一个文件拉回来，wheel 里躺的才是被断言覆盖过的产物。四个平台口径一致，
      # 发版脚本也就不必对某个平台写特例。
      #
      # 命名：`accel-<平台>-<架构>`（如 `accel-linux-x64`、`accel-macos-arm64`）。
      # 为什么不沿用 `accel-${{ matrix.os }}`：`matrix.os` 是 runner 标签
      # （`ubuntu-latest` / `macos-15-intel` / `macos-latest`），标签会随 GitHub
      # 退役而换（`macos-13` / `macos-14` 已经退役过），而**产物名的平台语义不会**
      # ——`_accel-macos-x64.abi3.so` 永远是 x64。用标签命名等于让下载路径随
      # runner 迁移而失效，本地脚本就得跟着改。平台/架构由 `build_accel.py` 里的
      # 同一张表算，与产物文件名保持同一来源。
      #
      # `if-no-files-found: error`：这一步存在的唯一目的就是交出产物，找不到
      # 文件说明构建或命名漂移了，必须红。
      - name: resolve accel artifact coordinates
        id: accel_coords
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys

          sys.path.insert(0, ".")
          import build_accel

          name = build_accel.artifact_name()   # 如 _accel.abi3.so / _accel-macos-arm64.abi3.so
          # 平台/架构段只从**产物名本身**反推，不再另行判断 `sys.platform`：
          # 产物名已经是 `artifact_name()` 与加载器共用的事实标准，反推能保证
          # artifact 名、下载路径、wheel 里的文件名三者永远指同一个东西。
          # 早期版本在这里另写一遍 `sys.platform` 映射，等于把「平台→名字」的
          # 判断复制了第三份，改一处漏一处就会让下载路径与实际文件脱钩。
          if name.startswith("_accel-macos-"):
              plat, arch = "macos", name[len("_accel-macos-"):-len(".abi3.so")]
          elif name == "_accel.pyd":
              plat, arch = "windows", "x64"
          else:
              plat, arch = "linux", "x64"
          # GitHub 的 ubuntu-latest / windows-latest 目前都是 x86_64；macOS 的架构
          # 段直接来自产物名。真出现 arm64 runner 时 `_accel-macos-arm64` 这种名字
          # 会自动带上架构，而 linux/windows 的 arm64 目前不在矩阵里。
          print("artifact=accel-%s-%s" % (plat, arch))
          print("file=dcg/_accel/" + name)
          PY

      - name: upload accel binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.accel_coords.outputs.artifact }}
          path: ${{ steps.accel_coords.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      # abi3 覆盖断言 —— 本 job 的核心价值所在。
      # `Cargo.toml` 声明 `abi3-py38`，意味着**同一个二进制**要能在 3.8 上加载；
      # 只看 3.13 能导入，这句话就只是纸面声明（3.13 构建的普通扩展本来就能在
      # 3.13 上导入）。所以这里在同一个 runner 上再切一个 3.8 解释器，加载刚才
      # 那个已经落盘的产物并真正调一次。
      #
      # 为什么不拆成 accel-build / accel-load 两个 job：setup-python 只改 PATH，
      # 构建步骤已经结束、cargo 不再被调用，所以「先 3.13 构建、再切 3.8 加载」
      # 在单 job 里不会冲突；拆 job 反而要 artifact 上传/下载（pyd 与 so 的命名、
      # 下载后的路径），凭空多两个失败面。
      #
      # `continue-on-error` 只在 `strict_38 == false` 的平台（macos-latest/arm64）上
      # 生效：那里没有 3.8 的预编译产物，装失败是预期内的。其余三个平台装不上就是
      # 真失败 —— 该平台本应有 3.8，装不上的话 abi3 结论无从谈起。
      - uses: actions/setup-python@v5
        id: py38
        if: matrix.strict_38
        with:
          python-version: "3.8"
          allow-prereleases: false

      - uses: actions/setup-python@v5
        id: py38_soft
        if: ${{ !matrix.strict_38 }}
        continue-on-error: true
        with:
          python-version: "3.8"
          allow-prereleases: false

      # 断言「同一个二进制」真的能在 3.8 上跑起来。注意这里不能省掉版本自检：
      # 上一步若失败，PATH 上的 `python` 还是 3.13，不校验版本就会出现
      # 「3.13 在 3.13 上导入成功」的假绿。
      - name: abi3 load on python 3.8
        shell: bash
        run: |
          if [ "${{ matrix.strict_38 }}" = "true" ]; then
            python -VV
            python -c "import sys; assert sys.version_info[:2] == (3, 8), sys.version; import dcg._accel._accel as m; assert m.mn([3, 1, 2]) == 1, m.mn([3, 1, 2]); print('abi3 OK: same binary loaded on', sys.version.split()[0])"
          elif [ "${{ steps.py38_soft.outcome }}" = "success" ]; then
            python -VV
            python -c "import sys; assert sys.version_info[:2] == (3, 8), sys.version; import dcg._accel._accel as m; assert m.mn([3, 1, 2]) == 1; print('abi3 OK (arm64):', sys.version.split()[0])"
          else
            echo "::warning::本平台没有可用的 Python 3.8（arm64 预编译产物缺失），abi3 跨版本断言在此平台跳过；x64/Windows/Linux 三个平台仍然强制断言。"
            python -VV
            python -c "import dcg._accel._accel as m; print('arm64 构建可用，导出', sorted(n for n in dir(m) if not n.startswith('_')))"
          fi

      # 前向兼容：abi3 是「向后兼容」的承诺（3.8 构建、新版本可加载），
      # 但那是纸面语义 —— 同一个产物在**最新稳定版**（3.15）上真的加载并调一次，
      # 才算证明它没有踩到新版本的解释器内部变化（模块初始化钩子、类型槽位）。
      #
      # 这里**不受 `strict_38` 约束**：那条开关管的是「本平台有没有 3.8 的预编译
      # 解释器」，跟前向加载毫无关系。早先把它俩绑在一起，结果 macos-latest
      # （arm64，strict_38=false）上 3.15 那步整条被跳过 —— 恰恰是 abi3 唯一
      # 没被本地验证过的平台，前向断言反而不跑。3.15 在 darwin/arm64 有官方
      # 构建（actions/python-versions manifest 里有），四个平台都该真加载。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: false

      - name: abi3 load on python 3.15
        shell: bash
        run: |
          # 与 3.8 那步同一条版本自检思路：不校验版本就会出现「3.13 在 3.13 上
          # 导入成功」的假绿（`python` 没被 setup-python 换掉时就是这种情况）。
          python -VV
          python -c "import sys; assert sys.version_info[:2] == (3, 15), sys.version; import dcg._accel._accel as m; assert m.mn([3, 1, 2]) == 1, m.mn([3, 1, 2]); print('abi3 OK: same binary loaded on', sys.version.split()[0])"

      # 失败时把排障需要的三样东西打全：解释器版本（是不是切错了）、
      # `dcg._accel` 的实际内容（产物到底在不在、有没有被打包进来）、
      # 平台标识（三平台里哪一个）。`|| true` 保证诊断步骤本身不再失败，
      # 否则真正的错误会被诊断步骤的报错盖掉。
      - name: accel diagnostics
        if: failure()
        shell: bash
        run: |
          python -VV
          python -c "import platform; print(platform.platform())"
          ls -l dcg/_accel || true
          python -c "import dcg._accel, os; print(os.path.dirname(dcg._accel.__file__)); print(dir(dcg._accel))" || true

  # join 性能基准（2.2.3 的 `$lookup` 多参形态）。
  #
  # 为什么单独一个 job、且**不挂 needs**：基准跑的是右表规模（1e3 → 1e6）对每行
  # 探测成本的影响，与 Python 版本矩阵无关；跟 test 串起来只会让基准的耗时/抖动
  # 拖慢门禁。它也不进任何门禁 —— 绝对数字随 runner 型号漂移，把它当断言就是
  # 制造随机红（口径见 evidence/join_bench.py 文件头）。
  #
  # 为什么不跑 pull_request：PR 上跑基准只会拖慢评审，且 fork 的 runner 与 main
  # 不是同一批机器，数字没有可比性。push 到 main 与手动触发才落 artifact。
  #
  # 规模：`--ci` = 5 万行 × 右表 1e3/1e4、每项 3 次采样（关 GC）。本机 11.5 s，
  # runner 上也在 1 分钟内，离 10 分钟预算很远；1e6 档留给 workflow_dispatch 的
  # full 开关（`--full` 同样 3 次采样 —— 1e6 档首个样本系统性偏低，repeat=1 会取到
  # 偏小的那个数；本机 `--ci --full` 31.5 s）。
  join-bench:
    name: join-bench
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          allow-prereleases: false

      # 只装仓库本身：基准是纯标准库，没有 pytest 之类的额外依赖。
      - name: install dcg
        run: python -m pip install -e .

      - name: join bench
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            python -X utf8 evidence/join_bench.py --ci --full --json join-bench.json
          else
            python -X utf8 evidence/join_bench.py --ci --json join-bench.json
          fi

      # `if: always()` + `if-no-files-found: warn`：基准本身失败时，json 可能没写出来，
      # 这时不该再冒一个「找不到 artifact」的错把真正的失败信息挤掉；能传就传，
      # 供事后对比数字。
      - name: upload join-bench result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: join-bench
          path: join-bench.json
          if-no-files-found: warn
          retention-days: 14

  # 加速后端「真实配比」基准：`evidence/accel_bench.py`（由 T5 提供）。
  #
  # 为什么必须有这个 job：本机（Windows，无 macOS）只能验证「Linux/Windows 上
  # Rust 比 Python 快多少」，而**接线判据（≥1.3× 才接线）必须是同一台机器上
  # Rust 开 / Rust 关的配对测量** —— 跨机器比绝对耗时毫无意义（CPU 型号一变，
  # 比值就跟着变）。CI 的 Linux runner 是唯一一个「每次都是同一批机器、且
  # 有 Rust 工具链」的环境，所以基准结论只能在这里产出，再由本地拉回。
  #
  # 为什么不并入 `accel` job：`accel` 的职责是「证明扩展能构建、能在 3.8/3.15
  # 上加载」，跑在四个平台上、每多一步都是四份耗时；基准只在 Linux 上跑一次
  # 就够（比值是相对量，与平台无关的部分不需要四份）。混在一起还会让「基准红」
  # 与「abi3 断言红」的失败信息互相污染。
  #
  # 为什么要在这里装 Rust 而不是复用 `accel` 的产物：基准要测的是**本 runner
  # 当场构建的二进制**。用下载来的产物测，测到的是另一台机器的编译结果
  # （不同 GCC/LLVM 版本的代码生成差异足以吃掉 1.3× 门限附近的余量）。
  #
  # 为什么不挂 `needs`：与 join-bench 同理 —— 基准不是门禁的前置条件，
  # 让它等 `test` 的八个版本跑完只会白白排队。
  #
  # 触发条件：push 到 main、workflow_dispatch。**不跑 pull_request**：理由与
  # join-bench 一致（PR 上跑基准拖慢评审，fork 的 runner 数字不可比），且
  # 基准的判据是相对量，本来也不该在评审阶段当门禁用。
  accel-bench:
    name: accel-bench
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # 预算：checkout + 装 Python/Rust + 构建扩展约 3 分钟，`--ci` 档 60–90 秒，
    # 全量档本机 6–8 分钟（runner 上按 2 倍估）。12 分钟是硬上限而不是预期耗时：
    # 卡住时必须自己失败，不能占着 runner 到默认的 6 小时。
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          allow-prereleases: false

      - name: install dcg
        run: python -m pip install -e .

      # 与 `accel` job 用同一个 action、同一个理由（见该处注释）。
      - uses: dtolnay/rust-toolchain@stable

      # 复用仓库自己的构建脚本，不复制逻辑 —— 与 `accel` job 完全同一条命令，
      # 否则「基准测的二进制」与「abi3 验过的二进制」可能不是同一份。
      - name: build accel
        run: python build_accel.py

      # 构建完先显式确认后端真的加载起来了，再开跑。顺序反了的话，脚本会以
      # exit 2（环境不支持）结束，而那条退出码在 CI 上意味着**编排坏了**，
      # 不是「这台机器没有 Rust」。这一步让失败点直接落在构建上。
      - name: assert rust backend is live
        run: |
          python - <<'PY'
          import sys
          from dcg._accel import status
          st = status()
          print("accel status:", st)
          if not st["loaded"]:
              sys.exit("CI 上 Rust 后端未加载（error=%r, candidates=%r）——"
                       "构建步骤或产物命名漂移了，基准无从谈起"
                       % (st["error"], st["candidates"]))
          PY

      # 输出路径刻意落在 `_tmp/`：它已被 `.gitignore` 忽略，也被
      # `tests/test_sync_contract.py` 的 `_ARTIFACT_PREFIXES` 排除，所以无论
      # 本地还是 CI 跑多少次都不会把未跟踪文件混进「证据清单」那条断言。
      # （默认路径同样在 `_tmp/` 下，见 accel_bench.py 的 `--out`。）
      - name: accel bench
        run: |
          if [ ! -f evidence/accel_bench.py ]; then
            echo "::error::evidence/accel_bench.py 不存在 —— 基准脚本缺失时本 job 产不出任何判据，直接失败而不是静默跳过"
            exit 1
          fi
          mkdir -p _tmp
          if [ "${{ github.event.inputs.bench_full }}" = "true" ]; then
            python -X utf8 evidence/accel_bench.py --fail-on-regression --out _tmp/accel-bench.json
          else
            python -X utf8 evidence/accel_bench.py --ci --fail-on-regression --out _tmp/accel-bench.json
          fi

      # `if: always()`：基准判红（有已接线算子回归）时 json 仍然是**最有价值的
      # 那份证据**，必须传上来 —— 恰恰是失败的那一轮才需要看数字。
      # `if-no-files-found: warn`：脚本在 exit 2 或崩溃时可能没写完文件，
      # 这时不该再冒一个「找不到 artifact」把真正的错误挤掉。
      - name: upload accel-bench result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accel-bench
          path: _tmp/accel-bench.json
          if-no-files-found: warn
          retention-days: 14

      # 失败时把「为什么没跑起来」一次打全：解释器、后端状态、产物清单、
      # 以及已落盘的 json 头几行（有就贴）。`|| true` 同理，诊断步骤不许自己失败。
      - name: accel-bench diagnostics
        if: failure()
        run: |
          python -VV
          python -c "import platform; print(platform.platform())"
          python -c "from dcg._accel import status; print(status())" || true
          ls -l dcg/_accel || true
          echo "----- _tmp/accel-bench.json (head) -----"
          head -c 2000 _tmp/accel-bench.json || true

