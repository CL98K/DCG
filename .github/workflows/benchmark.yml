name: benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark.yml"
      - "evidence/bench_run.py"
      - "evidence/bench_protocol.py"
      - "evidence/bench_fast.py"
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per benchmark case
        required: true
        default: "100000"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: python-3.13 benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          allow-prereleases: false

      - name: install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: run 13-case performance protocol
        env:
          ROWS: ${{ inputs.rows || '100000' }}
        run: |
          set +e
          python -X utf8 evidence/bench_run.py --rows "$ROWS" --out perf_protocol_ci.json > benchmark.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 20 benchmark.log | while IFS= read -r line; do echo "::error::$line"; done
            cat benchmark.log
            exit "$rc"
          fi
          cat benchmark.log
          python - <<'PY'
          import json
          import os
          data = json.load(open("perf_protocol_ci.json", encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## DCG performance benchmark\n\n")
              f.write(f"- Commit: `{os.environ['GITHUB_SHA']}`\n")
              f.write(f"- Python: `{data['python']}`\n")
              f.write(f"- Rows: `{data['protocol']['rows']}`; runs: `{data['protocol']['runs']}`; repeats: `{data['protocol']['repeats']}`\n")
              f.write("- Runner: `ubuntu-latest` (shared GitHub-hosted runner; timing is observational, not a gate)\n\n")
              f.write("| Case | DCG µs/row | Hand µs/row | DCG/hand | Verdict |\n|---|---:|---:|---:|---|\n")
              for row in data["rows"]:
                  ratio = row["ratio"]
                  verdict = "slower" if ratio > 1.10 else ("faster" if ratio < 0.90 else "within ±10%")
                  line = f"{row['name']}: DCG={row['dcg_us']:.4f} µs/row, hand={row['hand_us']:.4f} µs/row, ratio={ratio:.2f}x ({verdict})"
                  f.write(f"| {row['name']} | {row['dcg_us']:.4f} | {row['hand_us']:.4f} | {ratio:.2f}× | {verdict} |\n")
                  print(f"::notice::{line}")
          PY

      - name: upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: dcg-benchmark-${{ github.run_id }}
          path: |
            perf_protocol_ci.json
            benchmark.log
          if-no-files-found: error
          retention-days: 90

      # artifact 下载要认证，check annotations 只回传前 10 条；
      # 完整 13 项的表格写进 commit 评论 —— 这条通道匿名可读，网页上也直接可见。
      - name: publish result as commit comment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          data = json.load(open("perf_protocol_ci.json", encoding="utf-8"))
          lines = [
              "### CI 性能基准（Python %s，%s 行）" % (data["python"], data["protocol"]["rows"]),
              "",
              "运行：[#%s](%s) · 共享 GitHub-hosted runner，耗时属观测值，不作门禁"
              % (os.environ["RUN_URL"].rsplit("/", 1)[-1], os.environ["RUN_URL"]),
              "",
              "| 用例 | DCG µs/行 | 手写 µs/行 | DCG/手写 | 判定 |",
              "| --- | ---: | ---: | ---: | --- |",
          ]
          for row in data["rows"]:
              r = row["ratio"]
              verdict = "慢" if r > 1.10 else ("快" if r < 0.90 else "持平")
              lines.append("| `%s` | %.4f | %.4f | %.2f× | %s |"
                           % (row["name"], row["dcg_us"], row["hand_us"], r, verdict))
          body = "\n".join(lines) + "\n"
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/commits/%s/comments"
              % (os.environ["GITHUB_REPOSITORY"], os.environ["SHA"]),
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json",
                       "User-Agent": "dcg-benchmark"},
              method="POST")
          with urllib.request.urlopen(req) as r:
              print("comment:", r.status, r.read().decode()[:120])
          PY
